# PostgreSQL configuration shared by project A and project B.
# Both projects MUST run with exactly this file so results are comparable.
# Sized for a small VM (2 vCPU / ~2 GB RAM) with the server capped at ~1 GB.

listen_addresses = '*'
max_connections = 100

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# WAL / checkpoints (durability left at defaults on purpose)
wal_level = replica
synchronous_commit = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# Planner
random_page_cost = 1.1

# Autovacuum stays at defaults: it is part of what is being measured.
autovacuum = on

# Instrumentation only (not used by the strategies themselves)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
track_wal_io_timing = on
log_autovacuum_min_duration = 0
log_checkpoints = on
log_lock_waits = on

# Timestamps are stored as TIMESTAMP (without time zone) in UTC.
timezone = 'UTC'
log_timezone = 'UTC'

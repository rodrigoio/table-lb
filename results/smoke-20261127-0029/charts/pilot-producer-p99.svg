pilot: Producer latency p99 per 5 s
</text>
<text x="14" y="36" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="10.483870967741936" opacity="1" fill="#464646">
Shows: p99 latency of the base producer&apos;s inserts in 5 s windows (repetition 1), from the scheduled send time to the commit: time queued in the client is
</text>
<text x="14" y="53" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="10.483870967741936" opacity="1" fill="#464646">
included.
</text>
<text x="14" y="70" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="10.483870967741936" opacity="1" fill="#464646">
Purpose: See whether insert latency stays flat or degrades over the run, and how bursts and B&apos;s switches show up. Values above a client&apos;s timeout would be
</text>
<text x="14" y="87" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="10.483870967741936" opacity="1" fill="#464646">
failed inserts.
</text>
